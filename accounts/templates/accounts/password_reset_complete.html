{% extends "base.html" %}
{% load static %}
{% block title %}رمز عبور تغییر کرد{% endblock %}
{% block body_class %}auth-body{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/landing.css' %}?v={{ ASSET_V }}">{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-wrap">
        <div class="auth-card">
            <span class="auth-logo" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="M3 12.5 12 17l9-4.5"/><path d="M3 17.5 12 22l9-4.5"/></svg>
            </span>

            <header class="auth-head">
                <h1 class="auth-title">رمز عبور تغییر کرد</h1>
                <p class="auth-sub">اکنون می‌توانید با رمز جدید وارد شوید.</p>
            </header>

            <a class="btn btn-primary btn-lg btn-block" href="{% url 'accounts:login' %}">
                ورود به حساب
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l6 6-6 6"/><path d="M20 12H4"/></svg>
            </a>
        </div>
    </div>
</section>
{% endblock %}

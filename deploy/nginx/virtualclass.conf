# Nginx in front of Daphne (VPS / bare-metal deployments).
#
#   sudo cp deploy/nginx/virtualclass.conf /etc/nginx/sites-available/virtualclass
#   sudo ln -s /etc/nginx/sites-available/virtualclass /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace classroom.example.com and the certificate paths, then:
#   sudo certbot --nginx -d classroom.example.com
#
# Two things this file is responsible for and nothing else can do:
#   * WebSocket upgrade headers — without them chat/whiteboard/presence die
#     with a 400/426 while plain pages still work;
#   * a large enough upload body (MAX_UPLOAD_MB, 25 MB by default).

upstream virtualclass_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name classroom.example.com;

    # certbot writes its redirect here; keep this until HTTPS works.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 is intentionally left out: the directive name differs between
    # nginx releases (`listen ... http2` on 1.18-1.24, `http2 on;` on 1.25+).
    # Add whichever your `nginx -v` supports; nothing in the app needs it.
    server_name classroom.example.com;

    ssl_certificate     /etc/letsencrypt/live/classroom.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classroom.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 25 MB uploads + multipart overhead (see MAX_UPLOAD_MB)
    client_max_body_size 32m;
    # Long-lived WebSocket connections: do not cut them at 60s.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Media (classroom logos) — public by design.
    # PRIVATE_MEDIA_ROOT must NEVER be mapped here: shared classroom files,
    # PDFs and assignment submissions are served by Django behind a permission
    # check (classrooms/views.py).
    location /media/ {
        alias /srv/virtualclass/media/;
        expires 1h;
        access_log off;
    }

    # OPTIONAL speed-up: serve the collected static files from nginx instead of
    # letting WhiteNoise stream them through Daphne. Both work — delete this
    # block and nothing breaks, because the app serves /static/ itself.
    # Keep the alias in sync with STATIC_ROOT, and note that `collectstatic`
    # also writes .gz versions (`gzip_static` sends them to browsers that ask).
    location /static/ {
        alias /srv/virtualclass/staticfiles/;
        expires 7d;
        access_log off;
        gzip_static on;
    }

    # WebSockets first: /ws/ must be upgraded, everything else proxied.
    location /ws/ {
        proxy_pass http://virtualclass_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://virtualclass_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The app trusts this because TRUST_X_FORWARDED_PROTO=true: it is what
        # makes Origin: https://… match and CSRF accept form POSTs.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

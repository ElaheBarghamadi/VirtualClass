# coturn configuration for VirtualClass (see ../coturn/docker-compose.yml)
# Secrets are NOT stored here — the username/password come from the command
# line (--user) so they can stay in .env.

listening-port=3478
# alt-listening-port=3479

# Media relay range (open these in the firewall too)
min-port=49152
max-port=65535

fingerprint
stale-nonce=600
no-multicast-peers
no-cli
no-tls
# Production: enable TLS on 5349 with a real certificate instead:
#   cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
#   pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
# and add "turns:turn.example.com:5349?transport=tcp" to WEBRTC_ICE_SERVERS.

# Abuse limits — a classroom does not need unbounded sessions.
user-quota=12
total-quota=200

# Do not let the relay be used to reach internal services (SSRF hardening).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
# If your students are NEVER on the same LAN as this server, also deny
# RFC1918 ranges so the relay cannot be abused to reach private networks:
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255

# Behind NAT (cloud VM with a private interface)? The relay must advertise the
# address clients can actually reach — uncomment and set the PUBLIC IP:
# external-ip=203.0.113.10
#
# Leave it commented when this host has the public IP on its own interface
# (typical for a bare-metal / home server). An empty value breaks startup,
# which is why it is not passed as a command-line flag.

# verbose
